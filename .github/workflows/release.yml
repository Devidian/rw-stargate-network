name: Validate and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn test
      - run: node scripts/transfer-smoke.js
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017
      - name: Check release metadata
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          test "${GITHUB_REF_NAME#v}" = "$(node -p 'require("./package.json").version')"
          test -s "release-notes/${GITHUB_REF_NAME#v}.md"
  publish:
    needs: validate
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            devidian/rw-stargate-network:${{ steps.version.outputs.version }}
            devidian/rw-stargate-network:latest
      - uses: softprops/action-gh-release@v3
        with:
          name: OZ Stargate Network ${{ steps.version.outputs.version }}
          body_path: release-notes/${{ steps.version.outputs.version }}.md
          draft: false
          prerelease: false
          files: |
            docker-compose.example.yml
            examples/nginx-ws.conf
